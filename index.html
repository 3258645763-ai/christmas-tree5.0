	<!DOCTYPE html>
	<html lang="zh-CN">
	<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
	<meta name="theme-color" content="#0f0505"/>
	<title>Merry Christmas · 金色经典</title>
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet"/>
	<style>
	  *{ margin:0; padding:0; box-sizing:border-box; }
	  html, body{ height:100%; overflow:hidden; }
	  body{
	    /* 舞台式暗角：中心微暖，四周沉入黑暗 */
	    background: radial-gradient(120% 85% at 50% 38%, #1d0f06 0%, #100704 46%, #050202 100%);
	    font-family: Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
	    color:#CCA43B;
	    user-select:none; -webkit-user-select:none;
	    -webkit-tap-highlight-color:transparent;
	  }
	  #scene{ position:fixed; inset:0; touch-action:none; cursor:grab; display:block; }
	  #scene.grabbing{ cursor:grabbing; }
	  .title-wrap{
	    position:fixed; top:6.5vh; left:0; right:0;
	    text-align:center; pointer-events:none;
	  }
	  .title-wrap h1{
	    font-family:'Great Vibes','Segoe Script',cursive;
	    font-weight:400;
	    font-size:clamp(44px, 10vmin, 92px);
	    line-height:1.15;
	    color:#FFD700;
	    text-shadow:0 2px 18px rgba(0,0,0,.6);   /* 只做可读性投影，不加光晕 */
	    opacity:0; transform:translateY(14px);
	    animation:rise 1.4s cubic-bezier(.22,.8,.3,1) .35s forwards;
	  }
	  .sub{
	    margin-top:1.6vh;
	    display:flex; align-items:center; justify-content:center; gap:16px;
	    opacity:0;
	    animation:fadeIn 1.2s ease .95s forwards;
	  }
	  .sub span{
	    font-size:clamp(11px, 1.9vmin, 14px);
	    letter-spacing:.62em; text-indent:.62em;
	    color:#CCA43B;
	  }
	  .sub::before,.sub::after{ content:""; height:1px; width:clamp(26px, 9vw, 96px); }
	  .sub::before{ background:linear-gradient(90deg, rgba(204,164,59,0), rgba(204,164,59,.7)); }
	  .sub::after { background:linear-gradient(270deg, rgba(204,164,59,0), rgba(204,164,59,.7)); }
	  .hint{
	    position:fixed; bottom:5.5vh; left:0; right:0;
	    text-align:center; pointer-events:none;
	    font-size:clamp(11px, 1.8vmin, 13px);
	    letter-spacing:.5em; text-indent:.5em;
	    color:rgba(222,190,110,.55);
	    opacity:0;
	    animation:fadeIn 1.5s ease 2.4s forwards, breathe 3.2s ease-in-out 3.9s infinite;
	    transition:opacity .9s ease;
	  }
	  .hint.off{ animation:none; opacity:0 !important; }
	  @keyframes rise{ to{ opacity:1; transform:none; } }
	  @keyframes fadeIn{ to{ opacity:1; } }
	  @keyframes breathe{ 0%,100%{ opacity:.35; } 50%{ opacity:.85; } }
	</style>
	</head>
	<body>
	<canvas id="scene"></canvas>
	<div class="title-wrap">
	  <h1>Merry Christmas</h1>
	  <div class="sub"><span>金色经典</span></div>
	</div>
	<div class="hint">轻触旋转</div>
	<script>
	'use strict';
	/* ================= 金色经典 · 参数 ================= */
	const TAU = Math.PI * 2;
	const PAL = {
	  leaves:['#0B3D0B', '#144514', '#006400'],   // 三层松绿
	  trunk :'#3e2723',
	  balls :['#FFD700', '#CCA43B', '#8B0000'],   // 亮金 / 暗金 / 深红玻璃球
	  ribbon:['#D4AF37', '#E3C158', '#C09A2B'],   // 金丝带三色调
	  star  :'#FFD700'
	};
	/* 自转速度：30 秒一圈（比原版 3.75 秒/圈慢得多）；尊重减弱动效偏好 */
	const AUTO_SPEED = matchMedia('(prefers-reduced-motion: reduce)').matches ? TAU/240 : TAU/30;
	const N_LEAF=8000, N_TRUNK=1000, N_BALL=600, N_RIB=6000, N_SNOW=250;
	const N = N_LEAF + N_TRUNK + N_BALL + N_RIB + N_SNOW;
	/* ================= 小工具 ================= */
	const rgb   = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
	const rgbaC = (h,a) => { const c=rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
	const mix   = (a,b,t) => { const A=rgb(a),B=rgb(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; };
	const shade = (h,f) => `rgb(${rgb(h).map(v=>Math.round(Math.min(255,Math.max(0,v*f)))).join(',')})`;
	/* ================= 离屏精灵（点 / 玻璃球 / 光晕） ================= */
	function sprite(size, paint){
	  const c=document.createElement('canvas'); c.width=c.height=size;
	  paint(c.getContext('2d'), size); return c;
	}
	function softDot(hex, hard=0.62){                       // 柔边圆点：针叶、雪花、树干
	  return sprite(32,(g,s)=>{
	    const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
	    gr.addColorStop(0, rgbaC(hex,1));
	    gr.addColorStop(hard, rgbaC(hex,1));
	    gr.addColorStop(1, rgbaC(hex,0));
	    g.fillStyle=gr; g.fillRect(0,0,s,s);
	  });
	}
	function ballSprite(hex){                               // 带高光的玻璃球
	  return sprite(48,(g,s)=>{
	    const cx=s/2, cy=s/2, r=s*0.47;
	    const gr=g.createRadialGradient(cx-r*0.38, cy-r*0.42, r*0.08, cx, cy, r);
	    gr.addColorStop(0,   mix(hex,'#ffffff',0.85));
	    gr.addColorStop(0.28,mix(hex,'#ffffff',0.30));
	    gr.addColorStop(0.72,hex);
	    gr.addColorStop(1,   shade(hex,0.42));
	    g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,r,0,TAU); g.fill();
	  });
	}
	const glowSprite = sprite(160,(g,s)=>{                  // 星星烛光
	  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
	  gr.addColorStop(0,   'rgba(255,240,200,0.85)');
	  gr.addColorStop(0.18,'rgba(255,214,110,0.42)');
	  gr.addColorStop(0.45,'rgba(230,170,70,0.12)');
	  gr.addColorStop(1,   'rgba(230,170,70,0)');
	  g.fillStyle=gr; g.fillRect(0,0,s,s);
	});
	const SPRITES = [
	  softDot(PAL.leaves[0]), softDot(PAL.leaves[1]), softDot(PAL.leaves[2]),  // 0-2 叶
	  softDot(PAL.trunk, 0.5),                                                 // 3 树干
	  ballSprite(PAL.balls[0]), ballSprite(PAL.balls[1]), ballSprite(PAL.balls[2]), // 4-6 装饰球
	  ballSprite(PAL.ribbon[0]), ballSprite(PAL.ribbon[1]), ballSprite(PAL.ribbon[2]), // 7-9 金丝带珠
	  softDot('#ffffff', 0.55)                                                 // 10 雪花
	];
	/* ================= 生成点云（复刻原 R 逻辑） ================= */
	const X=new Float32Array(N), Y=new Float32Array(N), Z=new Float32Array(N), SZ=new Float32Array(N);
	const SPR=new Uint8Array(N), BA=new Float32Array(N);
	const SPD=new Float32Array(N);                       // >0 即为雪花（下落速度，单位/秒）
	const TWF=new Float32Array(N), TWP=new Float32Array(N);   // 彩灯闪烁频率 / 相位
	const SWF=new Float32Array(N), SWP=new Float32Array(N), SWA=new Float32Array(N); // 雪横向摆动
	let i=0;
	for(let k=0;k<N_LEAF;k++,i++){                      // 针叶：7 层锯齿轮廓
	  const h=Math.random(), layer=(h*7)%1;
	  const r=(1-h)*0.65*(0.4+0.6*Math.pow(1-layer,0.7));
	  const th=Math.random()*TAU;
	  X[i]=r*Math.cos(th); Y[i]=h-0.5; Z[i]=r*Math.sin(th);
	  SZ[i]=0.6+Math.random()*1.2; SPR[i]=(Math.random()*3)|0; BA[i]=0.95;
	}
	for(let k=0;k<N_TRUNK;k++,i++){                     // 树干：细圆柱面
	  const th=Math.random()*TAU;
	  X[i]=0.12*Math.cos(th); Y[i]=-0.7+Math.random()*0.25; Z[i]=0.12*Math.sin(th);
	  SZ[i]=1.2; SPR[i]=3; BA[i]=1;
	}
	for(let k=0;k<N_BALL;k++,i++){                      // 装饰球：贴树轮廓，金色偏多
	  const h=Math.random()*0.95, layer=(h*7)%1;
	  const r=(1-h)*0.68*(0.4+0.6*Math.pow(1-layer,0.7));
	  const th=Math.random()*TAU;
	  X[i]=r*Math.cos(th); Y[i]=h-0.5; Z[i]=r*Math.sin(th);
	  SZ[i]=2+Math.random()*2;
	  const t=Math.random(); SPR[i]= t<0.42?4 : t<0.72?5 : 6;
	  BA[i]=1;
	  if(Math.random()<0.45){ TWF[i]=1.2+Math.random()*2.6; TWP[i]=Math.random()*TAU; } // 45% 会呼吸闪烁
	}
	for(let k=0;k<N_RIB;k++,i++){                       // 金丝带：10π 螺旋，略浮于叶面
	  const h=(k/(N_RIB-1))*0.95 + (Math.random()-0.5)*0.0016;
	  const r=(1-h)*0.65*1.05, th=10*Math.PI*h;
	  X[i]=r*Math.cos(th); Y[i]=h-0.5; Z[i]=r*Math.sin(th);
	  SZ[i]=1.5; SPR[i]=7+((Math.random()*3)|0); BA[i]=1;
	}
	for(let k=0;k<N_SNOW;k++,i++){                      // 雪
	  X[i]=-1+2*Math.random(); Y[i]=-0.8+2*Math.random(); Z[i]=-1+2*Math.random();
	  SZ[i]=0.5+1.5*Math.random();
	  SPD[i]=(0.015+0.02*Math.random())*24;
	  BA[i]=0.5+0.4*Math.random(); SPR[i]=10;
	  SWF[i]=0.25+0.5*Math.random(); SWP[i]=Math.random()*TAU; SWA[i]=0.012+0.02*Math.random();
	}
	/* ================= 画布与投影 ================= */
	const cvs=document.getElementById('scene');
	const ctx=cvs.getContext('2d');
	let W=0,H=0,S=0,CX=0,CY=0;
	function resize(){
	  const dpr=Math.min(window.devicePixelRatio||1, 2);
	  W=innerWidth; H=innerHeight;
	  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
	  cvs.style.width=W+'px'; cvs.style.height=H+'px';
	  ctx.setTransform(dpr,0,0,dpr,0,0);
	  S=Math.min(W/1.3, H/1.62, 640);      // 世界单位 → 像素
	  CX=W/2; CY=H*0.545;
	}
	addEventListener('resize',resize); resize();
	/* 帧缓存（避免每帧产生垃圾） */
	const PX=new Float32Array(N), PY=new Float32Array(N),
	      PR=new Float32Array(N), PA=new Float32Array(N),
	      BK=new Uint8Array(N);
	const NB=160, counts=new Uint32Array(NB+1), order=new Uint16Array(N);
	/* ================= 交互状态 ================= */
	let angle=0.6, pitch=0.13, vel=0;          // 方位角 / 俯仰角 / 惯性角速度
	let dragging=false, activePtr=null;
	let lastX=0,lastY=0,lastT=0, flickV=0;
	let downT=0,downX=0,downY=0;
	let introT=0, introEase=0, tAcc=0;
	const easeOutCubic=t=>1-Math.pow(1-t,3);
	const hint=document.querySelector('.hint');
	cvs.addEventListener('pointerdown',e=>{
	  if(activePtr!==null) return;
	  activePtr=e.pointerId; dragging=true;
	  vel=0; flickV=0;
	  lastX=downX=e.clientX; lastY=downY=e.clientY;
	  lastT=downT=performance.now();
	  cvs.classList.add('grabbing');
	  hint.classList.add('off');
	  cvs.setPointerCapture && cvs.setPointerCapture(e.pointerId);
	});
	cvs.addEventListener('pointermove',e=>{
	  if(!dragging || e.pointerId!==activePtr) return;
	  const now=performance.now();
	  const dx=e.clientX-lastX, dy=e.clientY-lastY;
	  const dtms=Math.max(1, now-lastT);
	  angle += dx*0.0062;                                   // 水平拖 → 旋转
	  pitch = Math.min(0.5, Math.max(-0.3, pitch - dy*0.0028)); // 垂直拖 → 俯仰
	  flickV = flickV*0.65 + (dx/dtms*1000)*0.35;           // 指针速度采样
	  lastX=e.clientX; lastY=e.clientY; lastT=now;
	});
	function release(e){
	  if(e.pointerId!==activePtr) return;
	  const now=performance.now();
	  const moved=Math.hypot(e.clientX-downX, e.clientY-downY);
	  if(now-downT<280 && moved<9){
	    vel=Math.max(vel,0)+1.5;                            // 轻点一下：像拨指尖陀螺般推一把
	  }else{
	    vel=Math.min(6, Math.max(-6, flickV*0.0062));       // 甩动惯性
	  }
	  dragging=false; activePtr=null;
	  cvs.classList.remove('grabbing');
	}
	cvs.addEventListener('pointerup',release);
	cvs.addEventListener('pointercancel',release);
	/* ================= 渲染 ================= */
	function render(dt,time){
	  const cosA=Math.cos(angle), sinA=Math.sin(angle);
	  const cosP=Math.cos(pitch), sinP=Math.sin(pitch);
	  const K=S/92*(0.52+0.48*introEase);                   // 点径系数 + 入场推近
	  /* --- 变换、透视投影、深度分桶 --- */
	  for(let j=0;j<N;j++){
	    let x=X[j], y=Y[j], z=Z[j], sf=1;
	    if(SPD[j]>0){                                       // 雪：下落 + 摆动 + 循环边界淡出
	      y+=SPD[j]*dt; if(y>1.2) y-=2; Y[j]=y;
	      x+=Math.sin(time*SWF[j]+SWP[j])*SWA[j];
	      const w=y+0.8; sf=Math.min(1, w*6, (2-w)*6);
	    }
	    const x1=x*cosA - z*sinA;                           // 绕 Y 轴（自转）
	    const z1=z*cosA + x*sinA;
	    const y1=y*cosP - z1*sinP;                          // 绕 X 轴（俯仰）
	    const z2=y*sinP + z1*cosP;
	    const d=1/(2.5 - z2);                               // 与原 R 代码相同的透视
	    PX[j]=x1*d*2; PY[j]=y1*d*2;
	    PR[j]=SZ[j]*d*K;
	    const dff=(z2+1.2)/2.2;                             // 远处渐隐（空气感）
	    let a=BA[j];
	    if(TWF[j]>0) a*=0.55+0.45*Math.sin(time*TWF[j]+TWP[j]);  // 彩灯呼吸
	    a*= SPD[j]>0 ? 0.6+0.4*dff : Math.min(1, dff+0.06);
	    PA[j]=a*sf;
	    let b=((z2+2.1)*(NB/4.2))|0;
	    BK[j]= b<0?0 : b>=NB?NB-1 : b;
	  }
	  /* --- 计数排序：O(n) 由远及近 --- */
	  counts.fill(0);
	  for(let j=0;j<N;j++) counts[BK[j]+1]++;
	  for(let b=0;b<NB;b++) counts[b+1]+=counts[b];
	  for(let j=0;j<N;j++) order[counts[BK[j]]++]=j;
	  /* --- 画面 --- */
	  ctx.clearRect(0,0,W,H);
	  drawGround(cosP,sinP,time);
	  for(let k=0;k<N;k++){
	    const j=order[k];
	    const r=PR[j], a=PA[j];
	    if(r<0.45 || a<0.02) continue;
	    ctx.globalAlpha=a;
	    ctx.drawImage(SPRITES[SPR[j]], CX+PX[j]-r, CY-PY[j]-r, r+r, r+r);
	  }
	  ctx.globalAlpha=1;
	  drawStar(time,cosP,sinP);
	}
	function drawGround(cosP,sinP,time){
	  const y2=-0.74*cosP, z2=-0.74*sinP;
	  const d=1/(2.5-z2);
	  const gy=CY - y2*d*2*S;
	  const R=0.52*S*(0.52+0.48*introEase);
	  ctx.save();
	  ctx.translate(CX,gy); ctx.scale(1,0.30);
	  const gr=ctx.createRadialGradient(0,0,0,0,0,R);
	  const pulse=1+0.12*Math.sin(time*2.1);                // 随星光的呼吸微微律动
	  gr.addColorStop(0,   `rgba(0,0,0,${0.50*pulse})`);
	  gr.addColorStop(0.3, 'rgba(15,8,4,0.26)');
	  gr.addColorStop(0.6, `rgba(255,178,80,${0.10*pulse})`);
	  gr.addColorStop(1,   'rgba(255,178,80,0)');
	  ctx.fillStyle=gr; ctx.fillRect(-R,-R,R*2,R*2);
	  ctx.restore();
	}
	function drawStar(time,cosP,sinP){
	  const y2=0.565*cosP, z2=0.565*sinP;
	  const d=1/(2.5-z2);
	  const x=CX, y=CY - y2*d*2*S;
	  const R=0.06*d*2*S*(1+0.045*Math.sin(time*2.1))*(0.6+0.4*introEase);
	  ctx.globalAlpha=0.55+0.18*Math.sin(time*2.6);
	  ctx.drawImage(glowSprite, x-R*3.4, y-R*3.4, R*6.8, R*6.8);
	  ctx.globalAlpha=1;
	  ctx.beginPath();
	  for(let k=0;k<10;k++){
	    const ang=Math.PI/2 + k*Math.PI/5;
	    const rr=(k%2===0)?R:R*0.42;
	    const px=x+rr*Math.cos(ang), py=y-rr*Math.sin(ang);
	    k===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
	  }
	  ctx.closePath();
	  const gr=ctx.createRadialGradient(x,y-R*0.2,R*0.05,x,y,R);   // 金属质感
	  gr.addColorStop(0,'#FFF3C4'); gr.addColorStop(0.55,'#FFD700'); gr.addColorStop(1,'#D9A93A');
	  ctx.fillStyle=gr; ctx.fill();
	  ctx.strokeStyle='rgba(255,248,220,0.85)';
	  ctx.lineWidth=Math.max(1,R*0.05); ctx.stroke();
	}
	/* ================= 主循环 ================= */
	let lastFrame=performance.now();
	function frame(now){
	  const dt=Math.min((now-lastFrame)/1000, 0.05);
	  lastFrame=now; tAcc+=dt;
	  introT=Math.min(1, introT+dt/2.8);                    // 3 秒开场：镜头缓缓推近
	  if(dragging) introT=Math.min(1, introT+dt*1.6);       // 交互时立即完成推近
	  introEase=easeOutCubic(introT);
	  if(!dragging){
	    angle+=(AUTO_SPEED+vel)*dt;                         // 自转 + 惯性衰减，最终回到慢速自转
	    vel*=Math.exp(-2.4*dt);
	    if(Math.abs(vel)<0.015) vel=0;
	  }
	  render(dt,tAcc);
	  requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);
	</script>
	</body>
	</html>
